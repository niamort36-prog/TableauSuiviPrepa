<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Suivi chantier">
  <!-- Icône de l'application : un pylône, en bleu marine et cyan RTE.
       Dessinée en aplats épais pour rester lisible à 16 px. -->
  <rect width="64" height="64" rx="13" fill="#054191"/>

  <!-- Nappe de conducteurs, derrière le pylône -->
  <g stroke="#00a6d9" stroke-width="2.6" stroke-linecap="round" opacity=".85">
    <path d="M4 17.5h10M50 17.5h10"/>
    <path d="M4 28h8M52 28h8"/>
  </g>

  <g fill="#ffffff">
    <!-- Tête et fût -->
    <path d="M29.6 7h4.8v26h-4.8z"/>
    <!-- Consoles -->
    <rect x="17" y="14.6" width="30" height="3.8" rx="1.3"/>
    <rect x="12" y="25.1" width="40" height="3.8" rx="1.3"/>
    <!-- Jambes -->
    <path d="M29.6 30.5h4.8L46.4 57h-6.2L32 38.4 23.8 57h-6.2z"/>
  </g>

  <!-- Chaînes d'isolateurs -->
  <g fill="#00a6d9">
    <circle cx="18.6" cy="21.4" r="2.1"/>
    <circle cx="45.4" cy="21.4" r="2.1"/>
    <circle cx="13.6" cy="31.9" r="2.1"/>
    <circle cx="50.4" cy="31.9" r="2.1"/>
  </g>
</svg>
